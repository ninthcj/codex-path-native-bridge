[package]
name = "cpr-omp-native-bridge"
version = "0.3.10"
edition = "2024"
rust-version = "1.99.1"
publish = false
license = "Apache-2.0"

[dependencies]
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs.git", rev = "402bc37fbb5c83378cc83cec89e9fa251e4a99c1", features = ["io"] }
tokio = { version = "1.52.3", default-features = false, features = ["io-std", "macros", "rt"] }

[dev-dependencies]
serde_json = "1.0.150"
tokio = { version = "1.52.3", default-features = false, features = ["io-util", "macros", "process", "rt", "time"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
