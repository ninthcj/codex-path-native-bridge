[package]
name = "cpr-omp-native-bridge"
version = "0.2.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
license = "Apache-2.0"

[dependencies]
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs.git", rev = "6a5300a7b5c649f2a6d548df70ccdd58d15e0025", features = ["io"] }
tokio = { version = "1.52.3", default-features = false, features = ["io-std", "macros", "rt"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
